# Berry: https://yarnpkg.com/configuration/yarnrc
# node-modules linker keeps Next/webpack tooling familiar to Yarn Classic.
nodeLinker: node-modules

yarnPath: .yarn/releases/yarn-4.9.1.cjs

logFilters:
  - code: YN0069
    level: discard

# Upstream manifests missing peers/deps (Yarn strict peer checks).
packageExtensions:
  "@azure/storage-common@*":
    dependencies:
      "@azure/core-client": "^1.9.3"
  "@mui/x-data-grid-generator@*":
    peerDependencies:
      react: "*"
      react-dom: "*"
      "@mui/system": "*"
  "@typescript-eslint/utils@*":
    peerDependencies:
      typescript: ">=4.8.4 <6.0.0"
  "eslint-plugin-jest@*":
    peerDependencies:
      typescript: ">=4.8.4 <6.0.0"
