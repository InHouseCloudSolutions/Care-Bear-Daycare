name: Docker CI Production

on:
  workflow_dispatch: # Allows manual builds

concurrency:
  group: docker-es-production-version-bump-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (with tags)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Compute next shared date-based version tag
        id: version
        shell: bash
        run: |
          set -euo pipefail

          date_prefix="$(date -u +%Y.%m.%d)"
          tag_prefix="${date_prefix}."

          # Latest tag like 2026.02.17.3; if none today, start at .1
          latest_tag="$(git tag -l "${tag_prefix}[0-9]*" --sort=-v:refname | head -n 1)"
          if [ -z "${latest_tag}" ]; then
            build_count=1
          else
            last_build="${latest_tag##*.}"
            build_count=$((last_build + 1))
          fi

          next_version="${date_prefix}.${build_count}"
          echo "next_version=$next_version" >> "$GITHUB_OUTPUT"

      - name: Create and push git tag
        shell: bash
        run: |
          set -euo pipefail
          next="${{ steps.version.outputs.next_version }}"

          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          if git rev-parse "$next" >/dev/null 2>&1; then
            echo "Tag $next already exists" >&2
            exit 1
          fi

          git tag -a "$next" -m "Release $next"
          git push origin "$next"

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          build-args: |
            NEXT_PUBLIC_API_BASE_URL=https://inhousecloudsolutions.com
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/cbd-frontend:${{ steps.version.outputs.next_version }}
            ${{ secrets.DOCKERHUB_USERNAME }}/cbd-frontend:latest
